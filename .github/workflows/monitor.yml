name: CS2 Monitor Update

on:
  schedule:
    - cron: '*/10 * * * *'  # 每10分钟
  workflow_dispatch:          # 手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pycryptodome

      - name: Fetch & Detect
        env:
          ECO_PARTNER_ID: ${{ secrets.ECO_PARTNER_ID }}
          ECO_PRIVATE_KEY_B64: ${{ secrets.ECO_PRIVATE_KEY_B64 }}
        run: python fetch_monitor.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/monitor_data.json docs/monitor.db
          git diff --staged --quiet || (git commit -m "🔄 monitor: auto update [skip ci]" && git push)