<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Monitor - 饰品异动监控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e1a;color:#e0e0e0;min-height:100vh}

/* 头部 */
.header{background:linear-gradient(135deg,#1a2332,#0a0e1a);padding:2rem;text-align:center;border-bottom:2px solid #2a4a6a;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#66b3ff,transparent);animation:scan 3s linear infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.header h1{font-size:2.2rem;color:#66b3ff;text-shadow:0 0 20px rgba(102,179,255,0.3)}
.header em{color:#8899aa;font-style:normal;font-size:0.95rem}

.container{max-width:1400px;margin:0 auto;padding:1.5rem}

/* 状态卡片 */
.status-row{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.card{background:linear-gradient(145deg,#1a2332,#121820);border-radius:12px;padding:1.5rem;flex:1;min-width:160px;border:1px solid #2a3a4a;text-align:center;transition:transform 0.2s,box-shadow 0.2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.3)}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#66b3ff,#4caf50,#f44336);opacity:0.7}
.card .label{font-size:0.75rem;color:#8899aa;text-transform:uppercase;letter-spacing:1px}
.card .value{font-size:2rem;font-weight:700;margin-top:0.5rem;background:linear-gradient(135deg,#fff,#66b3ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .sub-value{font-size:0.85rem;color:#8899aa;margin-top:0.3rem}

.red{color:#f44336}.green{color:#4caf50}.blue{color:#66b3ff}

/* 涨跌分布条 */
.dist-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:0.8rem;background:#1a2332;box-shadow:inset 0 1px 3px rgba(0,0,0,0.3)}
.dist-up{background:linear-gradient(90deg,#2e7d32,#4caf50);transition:width 0.5s ease}
.dist-flat{background:linear-gradient(90deg,#555,#8899aa);transition:width 0.5s ease}
.dist-down{background:linear-gradient(90deg,#c62828,#f44336);transition:width 0.5s ease}

/* 搜索框 */
.search-box{width:100%;padding:1rem 1.2rem;background:#1a2332;border:1px solid #2a3a4a;border-radius:10px;color:#e0e0e0;font-size:1rem;margin-bottom:1rem;transition:border-color 0.2s,box-shadow 0.2s}
.search-box:focus{outline:none;border-color:#66b3ff;box-shadow:0 0 0 3px rgba(102,179,255,0.1)}
.search-box::placeholder{color:#556677}

/* 筛选标签 */
.filter-tabs{display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap}
.filter-tab{padding:0.5rem 1rem;background:#1a2332;border:1px solid #2a3a4a;border-radius:20px;cursor:pointer;font-size:0.85rem;transition:all 0.2s;color:#8899aa}
.filter-tab:hover{background:#243447;color:#e0e0e0}
.filter-tab.active{background:linear-gradient(135deg,#66b3ff,#4a90d9);color:#fff;border-color:transparent}

/* 表格 */
table{width:100%;border-collapse:separate;border-spacing:0;background:#1a2332;border-radius:12px;overflow:hidden;border:1px solid #2a3a4a;margin-bottom:1.5rem}
th{background:linear-gradient(145deg,#243447,#1a2a3a);padding:1rem;text-align:left;font-weight:600;color:#8899aa;font-size:0.85rem;cursor:pointer;user-select:none;position:sticky;top:0;z-index:10}
th:hover{background:linear-gradient(145deg,#2a4a6a,#243447);color:#e0e0e0}
th:first-child{border-radius:12px 0 0 0}
th:last-child{border-radius:0 12px 0 0}
td{padding:1rem;border-bottom:1px solid #243447;transition:background 0.2s}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(102,179,255,0.05)}
.price-up{color:#4caf50;font-weight:600}.price-down{color:#f44336;font-weight:600}

/* 迷你趋势图 */
.sparkline{width:100px;height:35px}

/* 标签 */
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:600}
.tag-up{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#81c784}.tag-down{background:linear-gradient(135deg,#b71c1c,#c62828);color:#ef9a9a}

/* 告警卡片 */
.alert-card{background:linear-gradient(145deg,#1a2332,#121820);border-radius:12px;padding:1.2rem;margin-bottom:0.8rem;border:1px solid #2a3a4a;border-left:4px solid #f44336;transition:transform 0.2s}
.alert-card:hover{transform:translateX(5px)}
.alert-card.up{border-left-color:#4caf50}
.alert-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
.alert-title{font-weight:600;color:#e0e0e0}
.alert-time{font-size:0.75rem;color:#556677}
.alert-body{display:flex;gap:1rem;align-items:center}
.alert-price{font-size:1.1rem;color:#66b3ff}
.alert-arrow{color:#8899aa}
.alert-change{font-size:1.2rem;font-weight:700}

.section-title{font-size:1.3rem;margin:2rem 0 1rem;color:#66b3ff;display:flex;align-items:center;gap:0.5rem;font-weight:600}
.section-title::before{content:'';display:inline-block;width:4px;height:1.3rem;background:linear-gradient(180deg,#66b3ff,#4a90d9);border-radius:2px}

.meta{text-align:center;color:#556677;font-size:0.8rem;margin-top:2rem;padding:1rem;background:#1a2332;border-radius:8px}
.loading{text-align:center;padding:4rem;color:#556677}

/* 自动刷新指示器 */
.refresh-indicator{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-left:0.5rem;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* 图表容器 */
.chart-container{background:#1a2332;border-radius:12px;padding:1.5rem;border:1px solid #2a3a4a;margin-bottom:1.5rem}
.chart-title{font-size:1rem;color:#8899aa;margin-bottom:1rem}

/* 价格详情弹窗 */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center;padding:2rem}
.modal.active{display:flex}
.modal-content{background:linear-gradient(145deg,#1a2332,#121820);border-radius:16px;padding:2rem;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid #2a3a4a;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.modal-title{font-size:1.5rem;color:#66b3ff}
.modal-close{background:none;border:none;color:#8899aa;font-size:1.5rem;cursor:pointer;padding:0.5rem;transition:color 0.2s}
.modal-close:hover{color:#f44336}

/* 统计网格 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-item{background:#121820;padding:1rem;border-radius:8px;text-align:center}
.stat-label{font-size:0.75rem;color:#8899aa;margin-bottom:0.3rem}
.stat-value{font-size:1.5rem;font-weight:700;color:#66b3ff}

/* 移动端适配 */
@media (max-width: 768px) {
  .header h1{font-size:1.5rem}
  .card{min-width:100px;padding:1rem}
  .card .value{font-size:1.5rem}
  th,td{padding:0.8rem;font-size:0.8rem}
  .sparkline{width:60px;height:24px}
  .modal{padding:1rem}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}

/* 数据新鲜度 */
.fresh{color:#4caf50}.stale{color:#ff9800}.expired{color:#f44336}

/* 滚动条美化 */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#0a0e1a}
::-webkit-scrollbar-thumb{background:#2a3a4a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4a5a}

/* 加载动画 */
.skeleton{background:linear-gradient(90deg,#1a2332 25%,#243447 50%,#1a2332 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="header">
  <h1>CS2 Monitor</h1>
  <em>饰品价格异动监控 · ECOSteam 数据</em>
</div>
<div class="container" id="app">
  <div class="loading">
    <div style="font-size:3rem;margin-bottom:1rem">📊</div>
    <div>加载数据中...</div>
    <div style="margin-top:1rem;font-size:0.8rem;color:#556677">正在连接 ECOSteam API</div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">饰品详情</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// 全局状态
let currentData = null;
let sortField = 'hash_name';
let sortDesc = false;
let searchTerm = '';
let activeFilter = 'all';
let refreshTimer = null;
let lastRenderTime = 0;
let priceChart = null;

// 自动刷新间隔（毫秒）
const REFRESH_INTERVAL = 60000;

async function fetchData() {
  const resp = await fetch('monitor_data.json?' + Date.now());
  if (!resp.ok) throw new Error('数据加载失败');
  return resp.json();
}

// 绘制迷你趋势图（SVG）
function drawSparkline(history, width=100, height=35) {
  if (!history || history.length < 2) return '<span style="color:#556677">-</span>';
  
  const prices = history;
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const range = max - min || 1;
  
  let points = '';
  const len = prices.length;
  for (let i = 0; i < len; i++) {
    const x = (i / (len - 1)) * width;
    const y = height - ((prices[i] - min) / range) * height;
    points += (i ? ' ' : '') + x + ',' + y;
  }
  
  const color = prices[len-1] >= prices[0] ? '#4caf50' : '#f44336';
  
  return '<svg class="sparkline" viewBox="0 0 ' + width + ' ' + height + '">' +
    '<defs><linearGradient id="grad' + len + '" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:' + color + ';stop-opacity:0.3"/><stop offset="100%" style="stop-color:' + color + ';stop-opacity:0"/></linearGradient></defs>' +
    '<polygon fill="url(#grad' + len + ')" points="0,' + height + ' ' + points + ' ' + width + ',' + height + '"/>' +
    '<polyline fill="none" stroke="' + color + '" stroke-width="2" points="' + points + '"/>' +
    '<circle cx="' + width + '" cy="' + (height - ((prices[len-1] - min) / range) * height) + '" r="3" fill="' + color + '"/>' +
    '</svg>';
}

// 计算数据新鲜度
function getFreshness(updatedAt) {
  if (!updatedAt) return { class: 'expired', text: '未知' };
  const diff = Date.now() - new Date(updatedAt).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 5) return { class: 'fresh', text: '刚刚' };
  if (mins < 15) return { class: 'fresh', text: mins + '分钟前' };
  if (mins < 60) return { class: 'stale', text: mins + '分钟前' };
  return { class: 'expired', text: Math.floor(mins/60) + '小时前' };
}

// 排序函数
function sortPrices(prices) {
  const sorted = prices.slice();
  sorted.sort((a, b) => {
    let aVal = a[sortField];
    let bVal = b[sortField];
    
    if (aVal == null) aVal = sortDesc ? -Infinity : Infinity;
    if (bVal == null) bVal = sortDesc ? -Infinity : Infinity;
    
    if (typeof aVal === 'string') {
      aVal = aVal.toLowerCase();
      bVal = bVal.toLowerCase();
    }
    
    if (aVal < bVal) return sortDesc ? 1 : -1;
    if (aVal > bVal) return sortDesc ? -1 : 1;
    return 0;
  });
  return sorted;
}

// 筛选函数
function filterPrices(prices) {
  let filtered = prices;
  
  // 搜索筛选
  if (searchTerm) {
    const term = searchTerm.toLowerCase();
    filtered = filtered.filter(p => p.hash_name.toLowerCase().includes(term));
  }
  
  // 涨跌筛选
  if (activeFilter === 'up') {
    filtered = filtered.filter(p => (p.change_pct || 0) > 0);
  } else if (activeFilter === 'down') {
    filtered = filtered.filter(p => (p.change_pct || 0) < 0);
  } else if (activeFilter === 'alert') {
    filtered = filtered.filter(p => Math.abs(p.change_pct || 0) >= 5);
  }
  
  return filtered;
}

// 防抖函数
function debounce(fn, delay) {
  let timer = null;
  return function(...args) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

// 显示详情弹窗
function showDetail(item) {
  const modal = document.getElementById('detailModal');
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');
  
  title.textContent = item.hash_name;
  
  const history = item.history || [];
  const historyHtml = history.length > 0 
    ? '<div class="chart-container"><div class="chart-title">24小时价格走势</div>' + 
      drawSparkline(history, 700, 200) + '</div>'
    : '<div style="color:#556677;text-align:center;padding:2rem">暂无历史数据</div>';
  
  const statsHtml = '<div class="stats-grid">' +
    '<div class="stat-item"><div class="stat-label">当前价格</div><div class="stat-value">¥' + item.price.toFixed(2) + '</div></div>' +
    '<div class="stat-item"><div class="stat-label">在售数量</div><div class="stat-value">' + (item.sell_total || '--') + '</div></div>' +
    '<div class="stat-item"><div class="stat-label">价格变化</div><div class="stat-value ' + (item.change_pct > 0 ? 'green' : item.change_pct < 0 ? 'red' : '') + '">' + (item.change_pct > 0 ? '+' : '') + (item.change_pct?.toFixed(2) || '0') + '%</div></div>' +
    '<div class="stat-item"><div class="stat-label">历史最高</div><div class="stat-value">¥' + (history.length > 0 ? Math.max(...history).toFixed(2) : '--') + '</div></div>' +
    '</div>';
  
  body.innerHTML = statsHtml + historyHtml;
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('active');
}

// 点击弹窗外部关闭
document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function render(data) {
  currentData = data;
  const { stats, prices, alerts, updated_at, threshold_pct, monitor_interval_min } = data;

  const formatTime = (t) => {
    if (!t) return 'N/A';
    return t.replace('T',' ').substring(0,19);
  };

  const changeClass = (v) => v > 0 ? 'price-up' : v < 0 ? 'price-down' : '';
  const changeSign = (v) => v != null ? (v > 0 ? '+' : '') + v.toFixed(2) + '%' : '--';
  
  const freshness = getFreshness(updated_at);

  // 涨跌分布
  const total_changes = stats.up_count + stats.down_count + stats.flat_count;
  const upPct = total_changes ? (stats.up_count / total_changes * 100).toFixed(1) : 0;
  const downPct = total_changes ? (stats.down_count / total_changes * 100).toFixed(1) : 0;
  const flatPct = total_changes ? (stats.flat_count / total_changes * 100).toFixed(1) : 0;

  // 构建告警卡片
  let alertCards = '';
  const alertLen = Math.min(alerts.length, 10);
  for (let i = 0; i < alertLen; i++) {
    const a = alerts[i];
    const isUp = a.direction === 'up';
    alertCards += '<div class="alert-card ' + (isUp ? 'up' : '') + '">' +
      '<div class="alert-header">' +
        '<span class="alert-title">' + a.hash_name + '</span>' +
        '<span class="alert-time">' + formatTime(a.created_at) + '</span>' +
      '</div>' +
      '<div class="alert-body">' +
        '<span class="alert-price">¥' + a.old_price.toFixed(2) + '</span>' +
        '<span class="alert-arrow">→</span>' +
        '<span class="alert-price">¥' + a.new_price.toFixed(2) + '</span>' +
        '<span class="alert-change ' + (isUp ? 'green' : 'red') + '">' + (isUp ? '+' : '') + a.change_pct.toFixed(2) + '%</span>' +
      '</div>' +
      '</div>';
  }

  // 排序和筛选后的价格数据
  const processedPrices = filterPrices(sortPrices(prices));

  // 构建价格表格
  let priceRows = '';
  for (let i = 0; i < processedPrices.length; i++) {
    const p = processedPrices[i];
    priceRows += '<tr onclick="showDetail(currentData.prices.find(x => x.hash_name === \'' + p.hash_name.replace(/'/g, "\\'") + '\'))" style="cursor:pointer">' +
      '<td><strong>' + p.hash_name + '</strong></td>' +
      '<td style="font-size:1.1rem">¥' + p.price.toFixed(2) + '</td>' +
      '<td>' + (p.sell_total ?? '--') + '</td>' +
      '<td class="' + changeClass(p.change_pct) + '">' + changeSign(p.change_pct) + '</td>' +
      '<td>' + drawSparkline(p.history) + '</td>' +
      '</tr>';
  }

  const sortIndicator = (field) => sortField === field ? (sortDesc ? '▼' : '▲') : '';

  // 筛选标签
  const filterTabs = [
    {id:'all',label:'全部'},
    {id:'up',label:'上涨'},
    {id:'down',label:'下跌'},
    {id:'alert',label:'告警'}
  ];
  let filterHtml = '';
  for (let i = 0; i < filterTabs.length; i++) {
    const tab = filterTabs[i];
    filterHtml += '<span class="filter-tab ' + (activeFilter === tab.id ? 'active' : '') + '" onclick="setFilter(\'' + tab.id + '\')">' + tab.label + '</span>';
  }

  document.getElementById('app').innerHTML = 
    '<div class="status-row">' +
      '<div class="card"><div class="label">监控物品</div><div class="value">' + stats.item_count + '</div><div class="sub-value">件饰品</div></div>' +
      '<div class="card"><div class="label">今日告警</div><div class="value ' + (stats.alert_count ? 'red' : '') + '">' + stats.alert_count + '</div><div class="sub-value">次异动</div></div>' +
      '<div class="card"><div class="label">平均涨跌</div><div class="value ' + 
        (stats.avg_change_pct > 0 ? 'green' : stats.avg_change_pct < 0 ? 'red' : '') + '">' + 
        (stats.avg_change_pct > 0 ? '+' : '') + (stats.avg_change_pct?.toFixed(2) ?? '--') + '%</div><div class="sub-value">整体趋势</div></div>' +
      '<div class="card"><div class="label">数据更新</div><div class="value ' + freshness.class + '" style="font-size:1.2rem">' + 
        freshness.text + '</div><div class="sub-value"><span class="refresh-indicator"></span>自动刷新中</div></div>' +
    '</div>' +

    '<div class="card" style="margin-bottom:1.5rem">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:0.8rem;flex-wrap:wrap;gap:0.5rem">' +
        '<span class="green" style="font-weight:600">📈 涨 ' + stats.up_count + ' (' + upPct + '%)</span>' +
        '<span style="color:#8899aa;font-weight:600">➡️ 平 ' + stats.flat_count + ' (' + flatPct + '%)</span>' +
        '<span class="red" style="font-weight:600">📉 跌 ' + stats.down_count + ' (' + downPct + '%)</span>' +
      '</div>' +
      '<div class="dist-bar">' +
        '<div class="dist-up" style="width:' + upPct + '%"></div>' +
        '<div class="dist-flat" style="width:' + flatPct + '%"></div>' +
        '<div class="dist-down" style="width:' + downPct + '%"></div>' +
      '</div>' +
      (stats.max_up ? '<div style="margin-top:0.8rem;font-size:0.85rem"><span class="green">🏆 最大涨幅: ' + stats.max_up.hash_name + ' +' + stats.max_up.change_pct + '%</span></div>' : '') +
      (stats.max_down ? '<div style="font-size:0.85rem;margin-top:0.3rem"><span class="red">📉 最大跌幅: ' + stats.max_down.hash_name + ' ' + stats.max_down.change_pct + '%</span></div>' : '') +
    '</div>' +

    (alerts.length ? 
      '<h2 class="section-title">最近告警</h2>' +
      '<div style="margin-bottom:0.5rem;color:#8899aa;font-size:0.85rem">阈值 ≥' + threshold_pct + '%</div>' +
      alertCards
      : '') +

    '<h2 class="section-title">价格监控</h2>' +
    '<input type="text" class="search-box" placeholder="🔍 搜索饰品名称..." value="' + searchTerm + '" id="searchInput">' +
    '<div class="filter-tabs">' + filterHtml + '</div>' +
    '<table><thead><tr>' +
      '<th onclick="handleSort(\'hash_name\')">物品 ' + sortIndicator('hash_name') + '</th>' +
      '<th onclick="handleSort(\'price\')">当前价格 ' + sortIndicator('price') + '</th>' +
      '<th onclick="handleSort(\'sell_total\')">在售 ' + sortIndicator('sell_total') + '</th>' +
      '<th onclick="handleSort(\'change_pct\')">涨跌 ' + sortIndicator('change_pct') + '</th>' +
      '<th>24h趋势</th>' +
    '</tr></thead><tbody>' + (priceRows || '<tr><td colspan="5" style="text-align:center;color:#556677;padding:3rem">无数据</td></tr>') + '</tbody></table>' +
    '<p class="meta">📊 数据源: ECOSteam · ⏱️ 更新间隔: ' + monitor_interval_min + ' 分钟 · 🕐 最后更新: ' + formatTime(updated_at) + '</p>';

  // 重新绑定搜索事件
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', debounceSearch);
  }
  
  lastRenderTime = Date.now();
}

// 排序处理
function handleSort(field) {
  if (sortField === field) {
    sortDesc = !sortDesc;
  } else {
    sortField = field;
    sortDesc = field === 'change_pct' || field === 'price' || field === 'sell_total';
  }
  if (currentData) render(currentData);
}

// 筛选处理
function setFilter(filter) {
  activeFilter = filter;
  if (currentData) render(currentData);
}

// 搜索处理（防抖）
const debounceSearch = debounce(function(e) {
  searchTerm = e.target.value;
  if (currentData) render(currentData);
}, 300);

// 初始加载
function load() {
  fetchData()
    .then(render)
    .catch(e => {
      document.getElementById('app').innerHTML =
        '<div class="loading">' +
        '<div style="font-size:3rem;margin-bottom:1rem">⚠️</div>' +
        '<div>数据加载失败</div>' +
        '<div style="margin-top:1rem;font-size:0.8rem;color:#556677">' + e.message + '</div>' +
        '<button onclick="load()" style="margin-top:1rem;padding:0.5rem 1rem;background:#66b3ff;border:none;border-radius:4px;color:#fff;cursor:pointer">重试</button>' +
        '</div>';
    });
}

// 启动
load();

// 自动刷新
function scheduleRefresh() {
  refreshTimer = setTimeout(() => {
    requestAnimationFrame(() => {
      load();
      scheduleRefresh();
    });
  }, REFRESH_INTERVAL);
}
scheduleRefresh();

// 页面可见性变化时优化刷新
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (refreshTimer) clearTimeout(refreshTimer);
  } else {
    scheduleRefresh();
    load();
  }
});

// ESC 关闭弹窗
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
